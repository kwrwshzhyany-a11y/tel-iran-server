fcAAtLPzAACP/Z) center/cover no-repeat;color:#fff;align-items:flex-end;justify-content:center;text-align:center;padding:38px 24px 54px;overflow:hidden;gap:6px}
#splash::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,2,0) 45%,rgba(10,6,2,.78) 100%)}
#splash i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:fl 9s ease-in-out infinite alternate}
#splash i:nth-child(1){width:280px;height:280px;top:-80px;inset-inline-end:-70px}
#splash i:nth-child(2){width:190px;height:190px;bottom:80px;inset-inline-start:-60px;animation-delay:-3s}
#splash i:nth-child(3){width:120px;height:120px;bottom:-30px;inset-inline-end:20%;animation-delay:-6s}
@keyframes fl{to{transform:translate(20px,-30px) scale(1.15)}}
.flag{width:230px;position:relative;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.wv{transform-origin:14px 100px;animation:wv 3.2s ease-in-out infinite}
@keyframes wv{0%,100%{transform:skewY(-2.5deg) scaleX(1)}50%{transform:skewY(2.5deg) scaleX(.975)}}
.rays{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#splash h1{display:none}
#splash p{opacity:.92;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.beta{position:relative;border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:3px 14px;font-size:.8em;background:rgba(255,255,255,.12)}
.go{position:relative;margin-top:14px;background:#fff;color:#0a4f8f;font-weight:700;padding:13px 54px;border-radius:30px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.go:active{transform:scale(.97)}
.by{position:relative;margin-top:10px;font-size:.85em;opacity:.8}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;min-height:56px}
.top b{flex:1}
.top button{font-size:1.25em;padding:4px 8px;color:#fff}
.top .tag{font-size:.65em;border:1px solid rgba(255,255,255,.6);border-radius:9px;padding:0 7px}
.srch{margin:10px 12px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--them);color:var(--fg);font:inherit;outline:0}
.list,.set,.msgs{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.row:active{background:var(--them)}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7fd3ff,#1b8fd8);display:grid;place-items:center;font-size:1.5em;flex:none}
.row div{flex:1;min-width:0}
.row b{display:block}
.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;color:var(--mut);font-size:.75em;align-self:flex-start}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.msgs{padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;line-height:1.7;background:var(--them);align-self:flex-start;border-start-start-radius:4px;word-break:break-word}
.b.me{background:var(--me);align-self:flex-end;border-start-start-radius:16px;border-start-end-radius:4px}
.b s{display:block;text-decoration:none;font-size:.7em;color:var(--mut);margin-top:2px}
.b u{display:block;text-decoration:none;font-size:.75em;font-weight:700;color:var(--pri)}
.chips{display:flex;gap:8px;padding:6px 12px;overflow-x:auto}
.chips button{white-space:nowrap;border:1px solid var(--pri);color:var(--pri);border-radius:18px;padding:5px 14px;font-size:.85em}
.inp{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.inp input,.it input[type=text]{flex:1;padding:11px 16px;border-radius:24px;border:1px solid var(--line);background:var(--them);color:var(--fg);font:inherit;outline:0;min-width:0}
.send{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;font-size:1.2em;flex:none}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.it small{color:var(--mut);display:block}
.it select,.it input[type=range]{font:inherit;background:var(--them);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px}
.it input[type=text]{flex:0 1 150px;padding:6px 12px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pri)}.sw.on::after{inset-inline-end:23px}
.hd{padding:16px 16px 6px;color:var(--pri);font-weight:700;font-size:.85em}
.soon{color:var(--mut);font-size:.75em;border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap}
#modal{background:rgba(0,0,0,.5);justify-content:flex-end}
#modal .sheet{background:var(--bg);padding:20px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:12px}
#modal input{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--them);color:var(--fg);font:inherit;direction:ltr}
.pbtn{background:var(--pri);color:#fff;border-radius:22px;padding:11px;font-weight:700}
#toast{position:absolute;bottom:80px;inset-inline:20px;margin:auto;width:max-content;max-width:90%;background:#000c;color:#fff;padding:8px 16px;border-radius:16px;font-size:.85em;z-index:9}

:root[data-wp="2"]{--w1:rgba(35,159,64,.3);--w2:rgba(53,194,200,.35);--w3:rgba(14,90,140,.25)}
:root[data-wp="3"]{--w1:rgba(255,140,60,.32);--w2:rgba(218,0,0,.2);--w3:rgba(140,90,255,.3)}

let WS=null,SID=0,SUBS={};
function mkDb(){return {collection:c=>{let n=100;const q={orderBy:()=>q,limit:k=>{n=k;return q},

 add(d){WS.send(JSON.stringify({op:'add',col:c,data:Object.assign({u:S.uid,n:S.nick},d)}));return Promise.resolve()}};return q}}}
function connectWs(){
 WS=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(AUTH?.token||''));
 WS.onopen=()=>{window.claude={use:async n=>n==='db'?mkDb():null};initDb()};
 WS.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(SUBS[m.sid])SUBS[m.sid](m);
  if(m.presence){peersPresence[m.from]=m.data;renderPresence()}
  if(m.signal){if(WS_CALL_CB)WS_CALL_CB({data:m.data})}
  if(m.leave){delete peersPresence[m.from];renderPresence()}
 };
 WS.onclose=()=>{db=null;SUBS={};if(cur)bubbles();setTimeout(connectWs,3000)};
}
function initDb(){
 if(!window.claude||!claude.use)return;
 claude.use('db').then(d=>{
  if(!d)return;db=d;
  d.collection('msgs').orderBy('ts','desc').limit(100).onSnapshot(s=>{
   om=s.docs.map(x=>x.data()).reverse().map(x=>({t:String(x.t||''),n:String(x.n||'?'),me:x.u===S.uid,h:hm(x.ts),rp:x.rp?String(x.rp):'',g:x.g?String(x.g):'',loc:x.loc?String(x.loc):'',exp:+x.exp||0,img:String(x.img||'').startsWith('data:image/')?x.img:'',aud:String(x.aud||'').startsWith('data:audio/')?x.aud:''}));
   decorateSecret(om);
   if(cur&&isOn(cur))bubbles();
   if(!$('#home').classList.contains('hide'))list();
  },()=>{db=null;bubbles()});
  d.collection('groups').orderBy('ts','desc').limit(50).onSnapshot(s=>{gs=s.docs.map(x=>{const v=x.data();return{id:'g:'+x.id,e:'👥',n:String(v.n||'?').slice(0,30),g:1,by:String(v.by||''),solo:!!v.solo}});if(!$('#home').classList.contains('hide'))list()},()=>{});
  if(cur&&isOn(cur))bubbles();
 }).catch(()=>{});
}

const KEYCACHE={};
async function getKey(id,pass){
 if(KEYCACHE[id])return KEYCACHE[id];
 const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pass||''),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('teliran-'+id),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

}
async function encStr(id,pass,text){
 try{const key=await getKey(id,pass),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
  return 'enc:'+btoa(String.fromCharCode(...iv))+'.'+btoa(String.fromCharCode(...new Uint8Array(ct)));
 }catch(e){return text}
}
async function decStr(id,pass,payload){
 try{const [ivb64,ctb64]=payload.slice(4).split('.'),iv=Uint8Array.from(atob(ivb64),c=>c.charCodeAt(0)),ct=Uint8Array.from(atob(ctb64),c=>c.charCodeAt(0));
  const key=await getKey(id,pass),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
 }catch(e){return null}
}

 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.onicecandidate=e=>{if(e.candidate)ROOM.emit('call',{type:'ice',cid:callId,room:callRoomId,cand:e.candidate})};
 pc.ontrack=e=>{$('#remoteV').srcObject=e.streams[0];$('#remoteV').classList.remove('hide');$('#callStat').textContent=''};
 $('#localV').srcObject=localStream;$('#localV').classList.toggle('hide',!video);
 $('#callAv').textContent=cur.e;$('#callName').textContent=name(cur);$('#callStat').textContent=T('ringing');
 show('callScr');
 const offer=await pc.createOffer();await pc.setLocalDescription(offer);
 ROOM.emit('call',{type:'offer',cid:callId,room:callRoomId,sdp:offer,name:S.nick,video});
}
async function acceptCall(){
 const d=pendingOffer;if(!d)return;$('#callbar').classList.add('hide');
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!d.video})}catch(e){return toast(T('noCam'))}
 callId=d.cid;callRoomId=d.room;
 pc=new RTCPeerConnection({iceServers:ICE});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.onicecandidate=e=>{if(e.candidate)ROOM.emit('call',{type:'ice',cid:callId,room:callRoomId,cand:e.candidate})};
 pc.ontrack=e=>{$('#remoteV').srcObject=e.streams[0];$('#remoteV').classList.remove('hide')};
 $('#localV').srcObject=localStream;$('#localV').classList.toggle('hide',!d.video);
 const dest=chs().find(c=>c.id===callRoomId);
 $('#callAv').textContent=dest?dest.e:'😎';$('#callName').textContent=dest?name(dest):'';$('#callStat').textContent='';
 show('callScr');
 await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
 const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
 ROOM.emit('call',{type:'answer',cid:callId,room:callRoomId,sdp:answer});
 pendingOffer=null;
}
function declineCall(){$('#callbar').classList.add('hide');if(pendingOffer)ROOM.emit('call',{type:'hangup',cid:pendingOffer.cid,room:pendingOffer.room});pendingOffer=null}
function endCall(){if(callId&&ROOM)ROOM.emit('call',{type:'hangup',cid:callId,room:callRoomId});closeCall()}
async function onCallMsg(msg){
 const d=(msg&&msg.data)||msg;if(!d||!d.type)return;
 if(d.type==='offer'){
  if(pc)return ROOM.emit('call',{type:'hangup',cid:d.cid,room:d.room});
  pendingOffer=d;$('#cbText').textContent=(d.name||'?')+' — '+T('incoming');$('#callbar').classList.remove('hide');return;
 }
 if(d.cid!==callId)return;
 if(d.type==='answer'&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));$('#callStat').textContent=''}catch(e){}}
 if(d.type==='ice'&&pc){try{await pc.addIceCandidate(d.cand)}catch(e){}}
 if(d.type==='hangup'){closeCall();toast(T('endC'))}
}
$('#acall').onclick=()=>startCall(false);
$('#vcall').onclick=()=>startCall(true);
$('#cbAcc').onclick=acceptCall;$('#cbDec').onclick=declineCall;$('#callEnd').onclick=endCall;
$('#callMute').onclick=()=>{if(localStream){const t=localStream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#callMute').textContent=t.enabled?'🎙️':'🔇'}}};

look();lang();sw();connectWs();initRoom();

<script>
(()=>{const gate=document.getElementById('authGate'),au=document.getElementById('au'),ap=document.getElementById('ap'),an=document.getElementById('an'),ae=document.getElementById('ae');
async function auth(path){
  ae.textContent='';
  const username=au.value.trim().toLowerCase(), password=ap.value, nick=(an.value.trim()||au.value.trim());
  if(!/^[a-z0-9_]{5,24}$/.test(username)){ae.textContent='نام کاربری باید ۵ تا ۲۴ کاراکتر انگلیسی، عدد یا _ باشد.';return}
  if(password.length<5){ae.textContent='رمز عبور باید حداقل ۵ کاراکتر باشد.';return}
  try{
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,nick})});
    const j=await r.json();
    if(!r.ok) throw Error(j.error||'خطا');
    localStorage.setItem('teliran_auth',JSON.stringify(j));location.reload();return;
  }catch(e){
    // Netlify Drop is static and has no Node API. Use local demo accounts there.
    try{
      const key='teliran_local_accounts', list=JSON.parse(localStorage.getItem(key)||'[]');
      if(path.includes('signup')){
        if(list.some(a=>a.username===username)){ae.textContent='این نام کاربری قبلاً گرفته شده';return}
        const a={id:'local_'+Date.now(),username,password,nick}; list.push(a); localStorage.setItem(key,JSON.stringify(list));
        localStorage.setItem('teliran_auth',JSON.stringify({token:'local_demo',...a,local:true}));location.reload();return;
      }else{
        const a=list.find(a=>a.username===username&&a.password===password);
        if(!a){ae.textContent='نام کاربری یا رمز اشتباه است';return}
        localStorage.setItem('teliran_auth',JSON.stringify({token:'local_demo',...a,local:true}));location.reload();return;
      }
    }catch(_){ }
    ae.textContent='خطا در اتصال به سرور. اگر نسخه را با Netlify Drop باز کرده‌ای، فعلاً حساب آزمایشی محلی ساخته می‌شود.';
  }
}
document.getElementById('as').onclick=()=>auth('/api/auth/signup');document.getElementById('al').onclick=()=>auth('/api/auth/login');
if(AUTH){gate.style.display='none';}
})();
</script></body>
